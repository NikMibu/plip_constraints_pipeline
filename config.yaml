# PLIP Constraints Pipeline - Configuration

# Target Protein Settings
target:
  uniprot_id: "P00918"  # Human Carbonic Anhydrase 2
  msa_path: "./data/msa/P00918.a3m"  # Path to MSA file (or empty/null for single sequence mode)
  ligand_whitelist:
    - "ZN"  # Zink muss immer bleiben
  forbidden_ligands:
    - "GOL"  # Glycerol
    - "DMS"  # Dimethyl sulfoxide
    - "SO4"  # Sulfate
    - "HOH"  # Water
    - "ACT"  # Acetate
    - "EDO"  # Ethylene glycol
    - "PEG"  # Polyethylene glycol
    - "CL"   # Chloride
    - "NA"   # Sodium

# Data Fetching Settings
fetch:
  limit: 300  # Maximum number of structures to fetch
  # Fixed list of PDB IDs, one per line. When set, the RCSB search is skipped.
  # The search runs against live annotations and returns a different set over
  # time, so use this to reproduce a specific run:
  #   pdb_ids_file: "data/pdb_ids.txt"   # the 200 benchmark structures
  pdb_ids_file: null
  allowed_types:
    - "Ki"
    - "IC50"
    - "Kd"  # Optional: Add Kd if needed

# Output Settings
output:
  base_dir: "./output"  # Output directory (will be created)

# Constraint Settings
constraints:
  max_distance: 6.0  # Maximum distance for constraints (Angstrom)
  ignore_metal_interactions: true  # Ignore metal complexes, only use ligand interactions
  # Pipeline generates 3 YAMLs per structure:
  # - default.yaml: no constraints
  # - pocket.yaml: pocket constraint (binder + contact list)
  # - contact.yaml: individual pairwise contact constraints
  
# Docker Settings (kept for timeout values, but not used for execution)
docker:
  plip_timeout: 300  # Seconds
  diffdock_timeout: 600  # Seconds (DiffDock takes longer)

# Micromamba Environment Settings
micromamba:
  # A standard micromamba install is a shell function, so the binary is not on
  # PATH. The pipeline reads $MAMBA_EXE; set an absolute path here to override.
  executable: "micromamba"
  plip_env: "plip"          # PLIP environment (pins plip 3.0.0)
  diffdock_env: "diffdock"  # DiffDock environment
  boltz_env: "boltz"        # Boltz-2 environment (boltz 2.2.1). Only needed to
                            # run the generated YAMLs; the pipeline itself does
                            # not call boltz. Rename if yours differs.

# DiffDock Settings
diffdock:
  # Path to the DiffDock repository. The environment variable DIFFDOCK_HOME
  # takes precedence if it is set:
  #   export DIFFDOCK_HOME=/path/to/DiffDock
  repo_path: "${DIFFDOCK_HOME}"
  samples_per_complex: 40  # Number of poses to generate
  inference_steps: 20
  actual_steps: 18
  top_n_poses: 1  # Use top-N pose(s) for constraints
  keep_all_poses: false  # Save all poses or just top-N

